<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Playbook LGPD para Agências de Tráfego — Dattis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montagu+Slab:opsz,wght@16..144,400;16..144,500&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
/* Identidade Dattis (proofmode): Montagu Slab nos títulos, Public Sans no texto,
   Geist Mono maiúsculo nos rótulos; off-white #F4F4F2, menta #6CEEAD, verde #002820. */
:root{
  --canvas:#f4f4f2; --surface:#fff; --surface-2:#f9f9f7;
  --forest:#002820; --forest-2:#0d3a2f;
  --line:#e3e3e1; --line-strong:#d0d3cf;
  --ink:#0a120f; --body:#26302c; --muted:#59645f; --faint:#8b948f;
  --brand:#6ceead; --brand-strong:#45d190; --brand-tint:#e4f9ee; --brand-tint-2:#cff5e1; --brand-ink:#05563a;
  --lilac:#ee9ef3; --lilac-tint:#fbe8fc; --orange:#f38536; --orange-tint:#fdebdc;
  --danger:#d84a4a; --danger-tint:#fbe9e9; --warn:#c8641b; --info:#3b7de4; --info-tint:#e7effc;
  --caution:#9a7300; --caution-tint:#fbf1d4; --ok:#11b981;
  --slab:"Montagu Slab",Georgia,serif; --sans:"Public Sans",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
}
@page{size:210mm 297mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#cfd3cf;font-family:var(--sans);color:var(--body);font-size:9.6pt;line-height:1.56;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#source{display:none}
#book{display:flex;flex-direction:column;align-items:center;gap:10mm;padding:10mm 0}
@media print{#book{display:block;padding:0;gap:0} body{background:none}}
.page{width:210mm;height:297mm;position:relative;overflow:hidden;background:var(--canvas);break-after:page;page-break-after:always}
.page:last-child{break-after:auto}

h1,h2,h3,h4{font-family:var(--slab);font-weight:400;color:var(--ink);margin:0;line-height:1.15;letter-spacing:-.005em;text-wrap:balance}
p{margin:0 0 2.6mm}
strong{color:var(--ink);font-weight:600}
em{font-style:italic}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}

/* ---------- Páginas de fluxo ---------- */
.flow{display:flex;flex-direction:column;padding:11mm 17mm 9mm}
.flow .run{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;font-size:6.6pt;color:var(--faint);padding-bottom:3mm;border-bottom:1px solid var(--line);margin-bottom:6mm}
.flow .run-r{color:var(--brand-ink)}
.flow .content{flex:1;min-height:0;overflow:hidden;display:flow-root}
.flow .foot{display:flex;justify-content:space-between;align-items:center;margin-top:3mm;padding-top:3mm;border-top:1px solid var(--line);font-family:var(--mono);font-size:6.6pt;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.foot-logo{display:flex;align-items:center;gap:2mm}
.foot-logo img{height:3.6mm}
.pnum{background:var(--forest);color:var(--brand);border-radius:999px;padding:1mm 3mm;font-size:7pt;min-width:9mm;text-align:center}

.content > *:first-child{margin-top:0}
.content h2{font-size:17pt;margin:5mm 0 3mm}
.content h3{font-size:12.5pt;margin:4.5mm 0 2mm}
.content h4{font-family:var(--mono);font-size:7.4pt;text-transform:uppercase;letter-spacing:.07em;color:var(--brand-ink);margin:3.5mm 0 1.5mm;font-weight:500}
.content ul,.content ol{margin:0 0 3mm;padding-left:5mm}
.content li{margin:0 0 1.2mm}
.content ul li::marker{color:var(--brand-strong)}
.content ol li::marker{font-family:var(--mono);color:var(--brand-ink);font-size:8pt}
.lead{font-size:11pt;line-height:1.5;color:var(--ink)}

/* ---------- Abertura de capítulo ---------- */
.chap-head{background:var(--forest);color:#fff;border-radius:7mm;padding:9mm 10mm 8mm;margin:0 0 6mm;position:relative;overflow:hidden}
.chap-head .num{font-family:var(--mono);font-size:7.4pt;letter-spacing:.08em;color:var(--brand);text-transform:uppercase}
.chap-head h1{font-size:25pt;color:#fff;margin:3mm 0 3mm;max-width:135mm}
.chap-head p{color:#c9d6d0;font-size:10pt;margin:0;max-width:140mm}
.chap-head .big{position:absolute;right:8mm;top:4mm;font-family:var(--slab);font-size:72pt;line-height:1;color:var(--brand);opacity:.95}
.chap-head .meta{display:flex;gap:2mm;flex-wrap:wrap;margin-top:5mm}
.chip{display:inline-flex;align-items:center;gap:1.5mm;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-size:6.4pt;border-radius:999px;padding:1mm 3mm;background:rgba(255,255,255,.08);color:#dfe9e4;border:1px solid rgba(255,255,255,.14)}
.chip.l{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.chip b{font-weight:500;border-radius:999px;padding:.2mm 1.8mm;font-size:6pt}
.b-alto{background:var(--danger);color:#fff}
.b-medio{background:var(--orange);color:#fff}
.b-baixo{background:var(--brand);color:var(--forest)}
.b-sim{background:var(--brand);color:var(--forest)}
.b-nao{background:var(--forest);color:var(--brand)}

/* ---------- Componentes ---------- */
.box{border-radius:5mm;padding:4.5mm 5.5mm;margin:0 0 4mm;break-inside:avoid}
.box .lbl{display:block;font-family:var(--mono);font-size:6.6pt;letter-spacing:.08em;text-transform:uppercase;margin-bottom:1.6mm;font-weight:500}
.box p:last-child,.box ul:last-child,.box ol:last-child{margin-bottom:0}
.agencia{background:var(--brand-tint);border:1px solid var(--brand-tint-2)} .agencia .lbl{color:var(--brand-ink)}
.alerta{background:var(--orange-tint);border:1px solid #f8d3b6} .alerta .lbl{color:var(--warn)}
.dica{background:var(--info-tint);border:1px solid #cfdcf6} .dica .lbl{color:var(--info)}
.lei{background:var(--surface);border:1px solid var(--line);position:relative;padding-left:9mm}
.lei::before{content:"";position:absolute;left:4mm;top:4.5mm;bottom:4.5mm;width:1.2mm;border-radius:2mm;background:var(--lilac)}
.lei .lbl{color:#9b3fa1}
.lei p{font-family:var(--slab);font-size:10.2pt;line-height:1.45;color:var(--ink)}
.lei .com{font-family:var(--sans);font-size:9.2pt;color:var(--body);border-top:1px dashed var(--line-strong);padding-top:2.5mm;margin-top:2.5mm}
.lei .com b{font-family:var(--mono);font-size:6.4pt;letter-spacing:.07em;text-transform:uppercase;color:var(--brand-ink);font-weight:500;margin-right:1.5mm}
.card{background:var(--surface);border:1px solid var(--line);border-radius:5mm;padding:5mm 6mm;margin:0 0 4mm;break-inside:avoid}
.dark{background:var(--forest);color:#d4e0da;border-radius:5mm;padding:5.5mm 6.5mm;margin:0 0 4mm}
.dark h3,.dark strong{color:#fff}
.dark .lbl{color:var(--brand)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin:0 0 4mm}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3.5mm;margin:0 0 4mm}
.grid2 > .card,.grid3 > .card,.grid2 > .box,.grid3 > .box{margin:0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:5mm;padding:4.5mm 5mm}
.stat .v{font-family:var(--slab);font-size:22pt;color:var(--ink);line-height:1}
.stat .v.mint{color:var(--brand-ink)}
.stat .t{font-size:8.4pt;color:var(--muted);margin-top:2mm;line-height:1.4}

/* Tabelas */
table.tbl{width:100%;border-collapse:separate;border-spacing:0;margin:0 0 4mm;font-size:8.4pt;line-height:1.42;background:var(--surface);border:1px solid var(--line);border-radius:4mm;overflow:hidden}
.tbl th{background:var(--forest);color:var(--brand);font-family:var(--mono);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:6.4pt;text-align:left;padding:2.6mm 3mm;vertical-align:bottom}
.tbl td{padding:2.4mm 3mm;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:nth-child(even) td{background:var(--surface-2)}
.tbl td strong{font-weight:600}
.tbl .c{text-align:center}
.tbl.check td:first-child{width:7mm}
.box-ck{display:inline-block;width:3.6mm;height:3.6mm;border:1.4px solid var(--brand-ink);border-radius:1mm;vertical-align:-.6mm;background:#fff}
.id{font-family:var(--mono);font-size:6.8pt;color:var(--brand-ink);white-space:nowrap}
.pr{display:inline-block;font-family:var(--mono);font-size:6pt;letter-spacing:.05em;border-radius:999px;padding:.4mm 2mm;text-transform:uppercase;white-space:nowrap}

/* Cenários */
.cen{background:var(--surface);border:1px solid var(--line);border-radius:5mm;margin:0 0 4.5mm;overflow:hidden;break-inside:avoid}
.cen-h{display:flex;gap:4mm;align-items:flex-start;padding:4.5mm 5.5mm 3.5mm;border-bottom:1px solid var(--line)}
.cen-n{flex:none;width:11mm;height:11mm;border-radius:999px;background:var(--forest);color:var(--brand);font-family:var(--mono);font-size:8.5pt;display:flex;align-items:center;justify-content:center}
.cen-h h3{font-size:12pt;margin:0 0 1.8mm}
.cen-h .chips{display:flex;gap:1.5mm;flex-wrap:wrap}
.cen-b{display:grid;grid-template-columns:1fr 1fr;gap:0}
.cen-b > div{padding:3.5mm 5.5mm}
.cen-b > div + div{border-left:1px solid var(--line)}
.cen-b .full{grid-column:1 / -1;border-left:0 !important;border-top:1px solid var(--line);background:var(--brand-tint)}
.cen-b .lbl{display:block;font-family:var(--mono);font-size:6.4pt;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:1.2mm}
.cen-b .full .lbl{color:var(--brand-ink)}
.cen-b p,.cen-b ul{font-size:8.8pt;margin-bottom:1.5mm}
.cen-b ul{padding-left:4.5mm}
.cen-b li{margin-bottom:.8mm}
.cen-b .full ul{columns:2;column-gap:7mm}
.cen-b .full li{break-inside:avoid}

/* Casos reais */
.caso{background:var(--surface);border:1px solid var(--line);border-radius:5mm;padding:5mm 6mm;margin:0 0 4.5mm;break-inside:avoid}
.caso .top{display:flex;justify-content:space-between;gap:4mm;align-items:baseline;margin-bottom:2mm}
.caso h3{font-size:13pt;margin:0}
.caso .yr{font-family:var(--mono);font-size:7pt;color:var(--faint);white-space:nowrap}
.caso .lic{background:var(--brand-tint);border-radius:3.5mm;padding:3mm 4mm;margin-top:2.5mm;font-size:8.9pt}
.caso .lic b{font-family:var(--mono);font-size:6.4pt;text-transform:uppercase;letter-spacing:.07em;color:var(--brand-ink);font-weight:500;display:block;margin-bottom:.8mm}
.caso .src{font-size:7.2pt;color:var(--faint);margin-top:2mm;margin-bottom:0}

/* Modelos de documentos */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:5mm;padding:6mm 7mm 4mm;margin:0 0 4mm;font-size:8.9pt}
.doc > *{break-inside:avoid}
.doc .dt{font-family:var(--slab);font-size:12pt;color:var(--ink);text-align:center;margin-bottom:3.5mm}
.doc .cl{font-family:var(--mono);font-size:7pt;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink);margin:3.5mm 0 1.2mm}
.doc p{margin-bottom:1.8mm}
.doc .ph{background:var(--caution-tint);color:#6d5200;border-radius:1mm;padding:0 1mm;font-family:var(--mono);font-size:7.4pt}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin:8mm 0 3mm}
.doc .sig div{border-top:1px solid var(--ink);padding-top:1.5mm;font-size:7.8pt;color:var(--muted);text-align:center}
.doc-cont{border-top-left-radius:0;border-top-right-radius:0;border-top:1px dashed var(--line-strong)}

/* Sumário */
.toc{margin:0;padding:0;list-style:none}
.toc li{display:flex;align-items:baseline;gap:2mm;padding:1.55mm 0;border-bottom:1px solid var(--line);margin:0}
.toc li .n{font-family:var(--mono);font-size:7pt;color:var(--brand-ink);width:12mm;flex:none}
.toc li .t{flex:1;color:var(--ink)}
.toc li .p{font-family:var(--mono);font-size:8pt;color:var(--ink)}
.toc li.part{border-bottom:0;padding:5mm 0 1.5mm}
.toc li.part .t{font-family:var(--slab);font-size:13pt}
.toc li.part .n{color:var(--faint)}
.toc li.part .p{background:var(--forest);color:var(--brand);border-radius:999px;padding:.5mm 2.5mm}
.toc li.sub .t{color:var(--muted);font-size:8.8pt;padding-left:4mm}

/* ---------- Capa ---------- */
.cover{background:var(--forest);color:#fff}
.cover .logo{position:absolute;left:18mm;top:18mm;height:11mm}
.cover .ed{position:absolute;right:18mm;top:20mm}
.cover .mark{position:absolute;right:-20mm;top:44mm;width:120mm;opacity:1}
.cover .title{position:absolute;left:18mm;top:92mm;width:165mm}
.cover .kick{font-family:var(--mono);font-size:8pt;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin-bottom:5mm}
.cover h1{font-size:46pt;line-height:1.02;color:#fff;letter-spacing:-.01em}
.cover h1 em{font-style:normal;color:var(--brand)}
.cover .sub{font-size:12.5pt;line-height:1.45;color:#c9d6d0;margin-top:7mm;max-width:128mm}
.cover .band{position:absolute;left:0;right:0;bottom:0;height:62mm;background:var(--brand)}
.cover .author{position:absolute;left:18mm;bottom:17mm;display:flex;align-items:center;gap:5mm;color:var(--forest)}
.cover .author img{width:26mm;height:26mm;border-radius:999px;object-fit:cover;border:1.2mm solid var(--forest)}
.cover .author .nm{font-family:var(--slab);font-size:17pt;line-height:1.1}
.cover .author .rl{font-family:var(--mono);font-size:7pt;letter-spacing:.07em;text-transform:uppercase;margin-top:1.5mm;color:#0d3a2f}
.cover .tags{position:absolute;right:18mm;bottom:19mm;display:flex;flex-direction:column;gap:2mm;align-items:flex-end}
.cover .tags span{background:var(--forest);color:var(--brand);font-family:var(--mono);font-size:6.8pt;letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:1.2mm 3.5mm}
.px{position:absolute;left:0;right:0;height:8mm;display:flex}
.px i{flex:1;display:block}

/* Contracapa */
.back{background:var(--brand);color:var(--forest)}
.back .inner{position:absolute;left:20mm;right:20mm;top:26mm}
.back h2{font-size:27pt;color:var(--forest);line-height:1.1;margin-bottom:6mm}
.back p{font-size:10.6pt;line-height:1.55;color:#0d3a2f}
.back ul{margin:5mm 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:2.5mm 6mm}
.back li{background:rgba(255,255,255,.45);border-radius:999px;padding:1.6mm 4mm;font-family:var(--mono);font-size:7pt;letter-spacing:.06em;text-transform:uppercase}
.back .foot-b{position:absolute;left:0;right:0;bottom:0;height:72mm;background:var(--forest);color:#c9d6d0}
.back .foot-b .au{position:absolute;left:20mm;top:16mm;display:flex;gap:5mm;align-items:center;width:110mm}
.back .foot-b img.ph{width:22mm;height:22mm;border-radius:999px;object-fit:cover;border:1mm solid var(--brand)}
.back .foot-b .au p{font-size:8.6pt;color:#c9d6d0;margin:0}
.back .foot-b .au b{display:block;font-family:var(--slab);font-weight:400;font-size:13pt;color:#fff;margin-bottom:1mm}
.back .foot-b .lg{position:absolute;right:20mm;top:18mm;height:10mm}
.back .foot-b .site{position:absolute;right:20mm;top:33mm;font-family:var(--mono);font-size:7pt;letter-spacing:.07em;text-transform:uppercase;color:var(--brand)}
.back .foot-b .legal{position:absolute;left:20mm;right:20mm;bottom:12mm;font-size:6.8pt;color:#8fa79c;border-top:1px solid rgba(255,255,255,.12);padding-top:3mm}

/* Abertura de parte */
.part{background:var(--forest);color:#fff}
.part.p2{background:var(--lilac);color:var(--forest)}
.part.p3{background:var(--orange);color:var(--forest)}
.part.p4{background:var(--brand);color:var(--forest)}
.part .pn{position:absolute;left:20mm;top:22mm;font-family:var(--mono);font-size:8pt;letter-spacing:.1em;text-transform:uppercase}
.part .big{position:absolute;left:16mm;top:40mm;font-family:var(--slab);font-size:190pt;line-height:.9;color:var(--brand)}
.part.p2 .big,.part.p3 .big,.part.p4 .big{color:var(--forest)}
.part h1{position:absolute;left:20mm;right:20mm;top:132mm;font-size:38pt;line-height:1.05;color:inherit}
.part .desc{position:absolute;left:20mm;width:130mm;top:178mm;font-size:11pt;line-height:1.5;opacity:.9}
.part .caps{position:absolute;left:20mm;right:20mm;bottom:22mm;display:flex;flex-wrap:wrap;gap:2mm}
.part .caps span{font-family:var(--mono);font-size:6.8pt;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1.2mm 3.5mm;border:1px solid currentColor;opacity:.9}

/* Folha de rosto / autor */
.plain{padding:22mm 20mm}
.author-pg .ph{width:62mm;height:62mm;border-radius:8mm;object-fit:cover}
</style>
</head>
<body>
<div id="source">
<!--CONTENT-->
</div>
<div id="book"></div>
<script>
(async function(){
  await Promise.all([
    document.fonts.load('400 12pt "Montagu Slab"'), document.fonts.load('400 10pt "Public Sans"'),
    document.fonts.load('600 10pt "Public Sans"'), document.fonts.load('italic 400 10pt "Public Sans"'),
    document.fonts.load('400 10pt "Geist Mono"'), document.fonts.load('500 10pt "Geist Mono"')
  ]);
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  const src = document.getElementById('source');
  const book = document.getElementById('book');
  const LOGO = '{{ASSETS}}/brand/logo-fundo-claro.png';
  let n = 0, label = '', c = null;
  const warnings = [];

  function addPage(el){ n++; el.dataset.num = n; book.appendChild(el); return el; }
  function newFlow(){
    const p = document.createElement('div');
    p.className = 'page flow';
    addPage(p);
    p.innerHTML = '<header class="run"><span>Playbook LGPD · Agências de tráfego</span><span class="run-r">' + label + '</span></header>' +
      '<div class="content"></div>' +
      '<footer class="foot"><span class="foot-logo"><img src="' + LOGO + '" alt="dattis"><span>Uso interno · Jhonatan Ribeiro</span></span><span class="pnum">' + n + '</span></footer>';
    c = p.querySelector('.content');
    return c;
  }
  const over = () => c.scrollHeight > c.clientHeight + 1;
  const KEEP = el => /^H[1-4]$/.test(el.tagName) || el.classList.contains('keep');
  function breakPage(){
    const carry = [];
    while (c.lastElementChild && KEEP(c.lastElementChild) && c.children.length > carry.length) carry.unshift(c.removeChild(c.lastElementChild));
    newFlow();
    carry.forEach(x => c.appendChild(x));
  }
  function splittable(el){ return el.matches('table, ul, ol, .split'); }
  function shellOf(el){
    const s = el.cloneNode(false);
    if (el.tagName === 'TABLE'){
      const th = el.querySelector('thead'); if (th) s.appendChild(th.cloneNode(true));
      const tb = document.createElement('tbody'); s.appendChild(tb); return [s, tb];
    }
    return [s, s];
  }
  function items(el){ return el.tagName === 'TABLE' ? [...el.querySelectorAll(':scope > tbody > tr')] : [...el.children]; }
  function split(el){
    const its = items(el);
    let [shell, tgt] = shellOf(el);
    c.appendChild(shell);
    let count = 0, idx = 0;
    if (el.tagName === 'OL') idx = (parseInt(el.getAttribute('start')) || 1) - 1;
    for (const it of its){
      tgt.appendChild(it);
      if (over()){
        tgt.removeChild(it);
        if (count === 0){ c.removeChild(shell); breakPage(); }
        else newFlow();
        [shell, tgt] = shellOf(el);
        if (el.tagName === 'OL') shell.setAttribute('start', idx + 1);
        if (count > 0) shell.classList.add('cont');
        c.appendChild(shell);
        tgt.appendChild(it);
        count = 0;
        if (over()) warnings.push('item maior que página: ' + it.textContent.slice(0, 80));
      }
      count++; idx++;
    }
  }
  function place(el){
    c.appendChild(el);
    if (!over()) return;
    c.removeChild(el);
    if (splittable(el)) { split(el); return; }
    breakPage();
    c.appendChild(el);
    if (over()) warnings.push('OVERFLOW: ' + (el.className || el.tagName) + ' — ' + el.textContent.trim().slice(0, 80));
  }
  for (const node of [...src.children]){
    if (node.classList.contains('page')) { addPage(node); continue; }
    if (node.tagName === 'SECTION'){
      label = node.dataset.label || '';
      newFlow();
      for (const el of [...node.children]) place(el);
    }
  }
  // Sumário: preenche números de página
  document.querySelectorAll('[data-toc]').forEach(li => {
    const t = document.getElementById(li.dataset.toc);
    const pg = t && t.closest('.page');
    li.querySelector('.p').textContent = pg ? pg.dataset.num : '??';
    if (!pg) warnings.push('toc sem alvo: ' + li.dataset.toc);
  });
  window.__BOOK = { pages: n, warnings };
})();
</script>
